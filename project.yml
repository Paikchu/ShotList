name: ShotList

options:
  minimumXcodeGenVersion: "2.35.0"
  bundleIdPrefix: com.max
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  developmentLanguage: zh-Hans

attributes:
  ORGANIZATIONNAME: "Max"
  LastUpgradeCheck: "2660"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Swift 6 语言模式：数据竞争在编译期检查，而不是留到线上偶发崩溃
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 贴进主协程的并发默认值（Xcode 26 新建工程的默认组合）：
    # 未标注隔离的代码默认落在主协程，后台工作必须显式说明
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CLANG_ENABLE_MODULES: YES

targets:
  ShotList:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShotList
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.max.ShotList
        PRODUCT_NAME: ShotList
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: QNQR296DT7
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: ShotList/Info.plist
      properties:
        CFBundleDisplayName: 分镜助手
        CFBundleName: ShotList
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Automatic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: 用于录制分镜视频。
        NSMicrophoneUsageDescription: 用于录制视频的现场声音。
        NSPhotoLibraryUsageDescription: 用于从相册导入视频。
  ShotListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShotListTests
    dependencies:
      - target: ShotList
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  ShotList:
    build:
      targets:
        ShotList: all
    test:
      targets:
        - ShotListTests
